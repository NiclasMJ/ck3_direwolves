 # After the battle
 dw_direwolf.1610.t:0 "The Rout"
 dw_direwolf.1610.desc:0 "The enemy line has broken, and what remains of it is running.\n\n[dw_battle_wolf.GetShortUINameNoTooltip] is already after them. It needs no command to understand what running men are for. In a moment it will be beyond calling back, out across the field after men with their backs turned — each one a story that will be told in their halls for years."
 dw_direwolf.1610.a:0 "Let it run them down."
 dw_direwolf.1610.b:0 "Call it back. It has done enough."
 dw_direwolf.1610.c:0 "Let it feed on the fallen."
 dw_direwolf.1620.t:0 "Teeth in the Rearguard"
 dw_direwolf.1620.desc:0 "The day is lost, and the enemy horse is coming on behind the retreat.\n\n[dw_battle_wolf.GetShortUINameNoTooltip] has stopped running. It stands in the mud between your men and the riders, hackles raised, and you know that it will hold there for as long as you ask it."
 dw_direwolf.1620.desc_captured:0 "They have you. The battle is lost, and you are on your knees in the mud with your hands bound, waiting to be marched off to someone’s dungeon.\n\nThen the camp goes quiet. Something circles at the edge of the torchlight, low and grey and patient, and the guards are no longer looking at you."
 dw_direwolf.1620.a:0 "Hold them, [dw_battle_wolf.GetShortUINameNoTooltip]!"
 dw_direwolf.1620.b:0 "Run. Both of us."
 dw_direwolf.1620.wolf_unhurt_tt:0 "[dw_battle_wolf.GetShortUINameNoTooltip] comes out of it unhurt"
 dw_direwolf.1620.freed_toast:0 "[dw_battle_wolf.GetShortUINameNoTooltip] broke you free"
 dw_direwolf.1630.t:0 "No Wolf at the Muster"
 dw_direwolf.1630.desc:0 "The army is gone. What remains straggles in by twos and threes, and every time a shape moves at the edge of the camp you look up.\n\nIt is never [dw_battle_wolf.GetShortUINameNoTooltip]. Nobody saw it go down. Nobody saw it at all after the line broke."
 dw_direwolf.1630.a:0 "Send out searchers. I will not leave it."
 dw_direwolf.1630.a.tt:0 "In one to three months you will learn whether it is found"
 dw_direwolf.1630.b:0 "It will find its own way home."
 dw_direwolf.1630.b.tt:0 "In a year or two it will come home - or it will not"
 dw_direwolf.1631.t:0 "The Search Ends"
 dw_direwolf.1631.desc_found:0 "They found [dw_battle_wolf.GetShortUINameNoTooltip] in a stand of pine two days’ ride from the field, thin and torn and still guarding something only it could see.\n\nIt let them put a rope on it. It would not let them touch it until it saw you."
 dw_direwolf.1631.desc_dead:0 "They found [dw_battle_wolf.GetShortUINameNoTooltip] in the end, in a ditch beside the road the enemy took. It had followed them. From the look of it, it took a few of them with it."
 dw_direwolf.1631.a:0 "Welcome home."
 dw_direwolf.1631.b:0 "Bury it where it fell."
 dw_direwolf.1632.t:0 "The Long Way Home"
 dw_direwolf.1632.desc_returned:0 "It came back on a morning of rain, a long grey shape walking up the road as though it had been gone an hour.\n\n[dw_battle_wolf.GetShortUINameNoTooltip] is leaner now, with a new scar across its muzzle. It walks past the guards, past the hall, and lies down at your feet."
 dw_direwolf.1632.desc_wild:0 "Word comes from the hills: a great grey wolf running with a pack of its own, wary of men and their roads.\n\nThe herders swear it is [dw_battle_wolf.GetShortUINameNoTooltip]. Perhaps they are right. If so, it has not come home. And from what they say, it is not looking for the way."
 dw_direwolf.1632.a:0 "I knew it would come."
 dw_direwolf.1632.b:0 "Then the wild has it."

