 dw_bl_maul_wolf_wounded_enemy:0 "Our $knight_culture_player_no_tooltip_lowercase$ [TARGET_CHARACTER.GetShortUINameNoTooltip] drove off the direwolf [CHARACTER.GetShortUINameNoTooltip], bleeding!"
