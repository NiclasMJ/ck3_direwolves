 setting_dw_wolves_36_desc:0 "The world grows to at most 36 direwolves. The default."
 setting_dw_wolves_48:0 "   Many (48)"
 setting_dw_wolves_48_desc:0 "The world grows to at most 48 direwolves."
 setting_dw_wolves_60:0 "   Abundant (60)"
 setting_dw_wolves_60_desc:0 "The world grows to at most 60 direwolves."
 setting_dw_wolves_endless:0 "   Endless"
 setting_dw_wolves_endless_desc:0 "No cap. Direwolves keep spawning and breeding without limit"
 rule_dw_pack_rank_system:0 "#R DW:#! Direwolf Pack Ranks"
 setting_dw_pack_rank_system_active:0 "   Active"
 setting_dw_pack_rank_system_active_desc:0 "The wolves settle a hierarchy among themselves. Each court's pack ranks itself once a year into #V Alpha#!, #V Beta#!, #V Omega#! and #V Outcast#!"
 setting_dw_pack_rank_system_inactive:0 "   Inactive"
 setting_dw_pack_rank_system_inactive_desc:0 "The #V Hierarchy System #! turned off"
 dw_call_direwolf_decision_effect_norank_tt:0 "Your #V direwolf#! comes to your court and joins the pack there."
 direwolf_idle:0 "Direwolf Idle"
 direwolf_howl:0 "Direwolf Howling"
 direwolf_walk:0 "Direwolf Running"
 rule_dw_direwolf_starting_packs:0 "#R DW:#! Wild Packs at Game Start"
 setting_dw_starting_packs_1:0 "   One"
 setting_dw_starting_packs_1_desc:0 "A single wild pack ranges beyond the Wall when the game begins."
 setting_dw_starting_packs_2:0 "   Two"
 setting_dw_starting_packs_2_desc:0 "Two wild packs range beyond the Wall when the game begins."
 setting_dw_starting_packs_3:0 "   Three"
 setting_dw_starting_packs_3_desc:0 "Three wild packs range beyond the Wall when the game begins. The default."
 setting_dw_starting_packs_4:0 "   Four"
 setting_dw_starting_packs_4_desc:0 "Four wild packs range beyond the Wall when the game begins."
 setting_dw_starting_packs_5:0 "   Five"
 setting_dw_starting_packs_5_desc:0 "Five wild packs range beyond the Wall when the game begins."
 rule_dw_direwolf_taming_access:0 "#R DW:#! Who May Tame a Direwolf"
 setting_dw_taming_stark_only:0 "   Wolf-Blooded Houses Only"
 setting_dw_taming_stark_only_desc:0 "Only a #V wolf-blooded#! house may bond with a direwolf. The Starks begin as one; any other line that comes to hold #V more than five#! bonds at once earns the same standing and keeps it. The default."
 setting_dw_taming_northmen:0 "   The North"
 setting_dw_taming_northmen_desc:0 "Wolf-blooded houses, and anyone of #V First Men#! heritage - northmen, mountain clansmen, crannogmen, Skagosi and the rest."
 setting_dw_taming_everyone:0 "   Anyone"
 setting_dw_taming_everyone_desc:0 "Anyone at all may try. #I The wolves still know their own:#! a wolf-blooded house is far likelier to win one over than a northman, and a northman than a stranger from the south."
 rule_dw_direwolf_beyond_the_wall_access:0 "#R DW:#! Expeditions Beyond the Wall"
 setting_dw_btw_limited:0 "   The Bold and the Mad"
 setting_dw_btw_limited_desc:0 "Only the #V brave#! or the #V lunatic#! will walk beyond the Wall to wrestle a direwolf out of a wild pack. The default."
 setting_dw_btw_full_access:0 "   Anyone Who May Bond"
 setting_dw_btw_full_access_desc:0 "The trek needs no particular temperament. Anyone permitted to bond at all may mount the expedition."
 setting_dw_btw_never:0 "   Never"
 setting_dw_btw_never_desc:0 "Nobody can go beyond the Wall for a direwolf."
 dw_direwolf_dynasty_wolf_blooded_toast:0 "#V [ROOT.Char.GetHouse.GetName]#! is spoken of now as a wolf-blooded house."
 dw_survey_wolfpacks_decision:0 "Survey the Wolfpacks"
 dw_survey_wolfpacks_decision_tooltip:0 "Send scouts and rangers to learn where the direwolf packs are."
 dw_survey_wolfpacks_decision_desc:0 "Rangers, hunters, and frightened smallfolk all bring the same word."
 dw_survey_wolfpacks_decision_confirm:0 "Take the count"
 dw_direwolf.0800.t:0 "The Packs of the World"
 dw_direwolf.0800.desc_intro:0 "This is what the count comes to. Every pack running in the world, and the one at the head of each."
 dw_direwolf.0800.prompt:0 "\n\nPick one to see the pack."
 dw_direwolf.0800.picked:0 "\n\n#V [dw_pack_pick.GetShortUIName]#! leads a pack, and carries a ferocity of #V [dw_pack_pick.MakeScope.ScriptValue('dw_direwolf_ferocity_value')|0]#!."
 dw_direwolf.0800.picked_wild:0 " They answer to nobody and range where they please."
 dw_direwolf.0800.picked_court:0 " They are kept in the hall of [dw_pack_pick.GetLiege.GetShortUIName]."
 dw_direwolf.0800.a:0 "Tell me of that one."
 dw_direwolf.0800.b:0 "So many."
 dw_bonded_direwolf_memory:0 "Bonded With a Direwolf"
 dw_lost_direwolf_memory:0 "Lost a Direwolf"
 dw_direwolf_saved_me_memory:0 "Saved by a Direwolf"
 dw_direwolf_bit_me_memory:0 "Bitten by a Direwolf"
 dw_bonded_direwolf_memory_desc:0 "I bonded with the direwolf [dw_wolf.GetShortUINameNoTooltip]."
 dw_bonded_direwolf_memory_desc_second_perspective:0 "you bonded with the direwolf [dw_wolf.GetShortUINameNoTooltip]."
 dw_bonded_direwolf_memory_desc_third_perspective:0 "[owner.GetTitledFirstName] bonded with the direwolf [dw_wolf.GetShortUINameNoTooltip]."
 dw_lost_direwolf_memory_desc:0 "My direwolf [dw_wolf.GetShortUINameNoTooltip] died, and I felt the bond tear as it went."
 dw_lost_direwolf_memory_desc_second_perspective:0 "your direwolf [dw_wolf.GetShortUINameNoTooltip] died, and you felt the bond tear as it went."
 dw_lost_direwolf_memory_desc_third_perspective:0 "[owner.GetTitledFirstName] lost the direwolf [dw_wolf.GetShortUINameNoTooltip]."
 dw_direwolf_saved_me_memory_desc:0 "The direwolf [dw_wolf.GetShortUINameNoTooltip] put itself between me and a killer in the dark."
 dw_direwolf_saved_me_memory_desc_second_perspective:0 "the direwolf [dw_wolf.GetShortUINameNoTooltip] put itself between you and a killer in the dark."
 dw_direwolf_saved_me_memory_desc_third_perspective:0 "the direwolf [dw_wolf.GetShortUINameNoTooltip] saved [owner.GetTitledFirstName] from a killer in the night."
 dw_direwolf_bit_me_memory_desc:0 "I reached for the direwolf [dw_wolf.GetShortUINameNoTooltip] too soon, and it took my hand for it."
 dw_direwolf_bit_me_memory_desc_second_perspective:0 "you reached for the direwolf [dw_wolf.GetShortUINameNoTooltip] too soon, and it took your hand for it."
 dw_direwolf_bit_me_memory_desc_third_perspective:0 "the direwolf [dw_wolf.GetShortUINameNoTooltip] turned on [owner.GetTitledFirstName] when [owner.GetSheHe] reached for it."
 dw_bond_with_direwolf_bitten_toast:0 "The direwolf would not be bonded, and drew blood."
 dw_direwolf.0400.t.unhurt:0 "Your direwolf drove the killer off, without suffering injury."
 dw_direwolf.0400.t.hurt:0 "Your direwolf drove the killer off, but was badly hurt."
 dw_direwolf.0400.t.killed:0 "Your direwolf died between you and the knife."
 dw_direwolf.0610.t.held:0 "The old alpha held its place, and scarred the challenger."
 dw_direwolf.0610.t.won:0 "The challenger won. The pack has a new alpha."
 dw_direwolf.0610.t.killed:0 "The challenge died trying."
 dw_direwolf.0630.t.drove_off:0 "The mother drove the intruder off."
 dw_direwolf.0630.t.wounded:0 "The mother saved the litter, but was badly wounded."
 dw_direwolf.0630.t.pup_lost:0 "It reached the den. A pup was lost."
 dw_direwolf.0640.t.beaten:0 "The alpha beat the offender down and broke it to Omega."
 dw_direwolf.0640.t.spared:0 "The alpha let the pair be."
 dw_direwolf.0640.t.killed:0 "The alpha would not suffer it, and the offender lies dead."
 dw_direwolf.0700.t.driven_off:0 "You drove the feral pack back into the trees."
 dw_direwolf.0700.t.mauled:0 "The feral pack mauled you before you broke free."
 dw_direwolf.0700.t.taken:0 "The feral pack took one of your party into the dark."
 dw_direwolf.1000.t:0 "A Wolf, and a Choice"
 dw_direwolf.1000.desc:0 "The direwolf [the_wolf.GetShortUINameNoTooltip] stands in the yard. Watching you expectantly. There is now way for you to judge, whether it will bond with you or bite your hand."
 dw_direwolf.1000.a:0 "Meet its eyes and show it who is master. #weak (Dominance)#!"
 dw_direwolf.1000.b:0 "Offer meat, and let it come to you. #weak (Patience)#!"
 dw_direwolf.1000.c:0 "Reach for it the old way, mind to mind. #weak (Greensight)#!"
 dw_direwolf.1003.t:0 "The Bond Takes"
 dw_direwolf.1003.desc:0 "[the_wolf.GetShortUINameNoTooltip] closes the last of the distance on its own and presses its head into your palm. You are now bonded for life."
 dw_direwolf.1003.a:0 "We are now bonded for life"
 dw_direwolf.1004.t:0 "Blood in the Snow"
 dw_direwolf.1004.desc:0 "You rose your hand too soon. [the_wolf.GetShortUINameNoTooltip] snarled and with one quick action bit your hand. Before you can react the direwolf runs away."
 dw_direwolf.1004.a:0 "Bind the wound."
 dw_direwolf_bond_success_toast:0 "The direwolf has bonded to you."
 dw_direwolf_bite_toast:0 "The direwolf drew blood. The bond failed."
 dw_debug_spawn_feral_pack_interaction:0 "Spawn Feral Wolfpack"
 dw_debug_spawn_feral_pack_interaction_desc:0 "#I Debug only.#! Spawn a wandering feral wolfpack of three direwolves - at least one male and one female - at this character's location."
 dw_debug_spawn_feral_pack_toast:0 "A feral wolfpack now roams here."
 dw_direwolf_feral_pack_moved_toast:0 "The direwolf [dw_move_leader.GetShortUIName] and its pack have crossed from [dw_move_old_county.GetName] into [dw_move_new_county.GetName]."
 dw_ignore_feral_moves_decision:0 "Ignore the Wandering Packs"
 dw_ignore_feral_moves_decision_tooltip:0 "Stop being told when a feral direwolf pack changes its hunting ground."
 dw_ignore_feral_moves_decision_desc:0 "The rangers keep bringing word every time the wild packs shift a valley over, and it is beginning to wear. Ignore them! They are of no concern of mine."
 dw_ignore_feral_moves_decision_confirm:0 "Look away"
 dw_ignore_feral_moves_decision_effect_tt:0 "You will no longer be notified when a feral direwolf pack moves."
 dw_watch_feral_moves_decision:0 "Watch the Wandering Packs"
 dw_watch_feral_moves_decision_tooltip:0 "Be told when a feral direwolf pack changes its hunting ground."
 dw_watch_feral_moves_decision_desc:0 "A pack on the move is a pack that might turn toward your gates. Set the rangers to bring you word whenever the wild direwolves shift their ground."
 dw_watch_feral_moves_decision_confirm:0 "Keep watch"
 dw_watch_feral_moves_decision_effect_tt:0 "You will be notified when a feral direwolf pack moves."
 dw_bonded_direwolf_combat_modifier_lesser:0 "Fights alongside a Direwolf"
 dw_bonded_direwolf_combat_modifier_lesser_desc:0 "A young wolf or weak wolf. Still a danger though."
 dw_bonded_direwolf_combat_modifier_strong:0 "Fights alongside a savage Direwolf"
 dw_bonded_direwolf_combat_modifier_strong_desc:0 "A strong wolf. This wolf is capable to bring down the most skilled knights."
 dw_bonded_direwolf_combat_modifier_fearsome:0 "Runs With a Monster of the North"
 dw_bonded_direwolf_combat_modifier_fearsome_desc:0 "A direwolf out of the oldest tales - massive, scarred, and merciless. Men beware."
 dw_hunt_feral_pack_decision:0 "Hunt the Wolfpack"
 dw_hunt_feral_pack_decision_tooltip:0 "A wild direwolf pack is loose in your lands. Send a hunter to be rid of it."
 dw_hunt_feral_pack_decision_desc:0 "Rangers and terrified farmers bring the same word from every corner: a pack of wild direwolves has taken to your lands, and no shepherd's dog nor watchman's spear will move them. A lord is expected to answer for the beasts within his borders."
 dw_hunt_feral_pack_decision_confirm:0 "Call the hunt"
 dw_direwolf.1100.t:0 "The Pack in Your Lands"
 dw_direwolf.1100.desc:0 "Word comes from [dw_hunt_county.GetName]: a wild pack of direwolves has settled in your lands, and the smallfolk dare not walk the roads after dark. [dw_hunt_pack_leader.GetShortUIName] runs at their head - a mighty beast, with eyes like coals and a jaw that has already closed on more than one straggler.\n\nSomething must be done. The only question is who does it."
 dw_direwolf.1100.desc_small:0 "\n\nThere are not many of them - two shadows at most on the treeline. One good hunter should be enough for this."
 dw_direwolf.1100.desc_pack:0 "\n\n#V [dw_hunt_pack_size|0] of them#! hunt together, and they hunt as one thing with a dozen legs. Whoever goes had better be worth sending."
 dw_direwolf.1100.desc_large:0 "\n\n#R [dw_hunt_pack_size|0] of them#!. A terrifying thought. These beasts fighting alongside eachother, with their only goal, to kill."
 dw_direwolf.1100.knight1:0 "Send [dw_knight_1.GetShortUIName] to face them."
 dw_direwolf.1100.knight2:0 "Send [dw_knight_2.GetShortUIName] instead."
 dw_direwolf.1100.knight3:0 "Or send [dw_knight_3.GetShortUIName]."
 dw_direwolf.1100.self:0 "I will hunt them myself."
 dw_direwolf.1100.copout:0 "Let them be. I will not risk my men's life"
 dw_direwolf.1101.t:0 "The Hunt"
 dw_direwolf.1101.desc:0 "[dw_hunter.GetShortUIName] rides out after the pack. There is more than one way to bring down a pack of direwolves. Yet some are more perilous than others. \n\n What approach do you think best?"
 dw_direwolf.1101.martial:0 "Meet them head-on. #weak (Prowess + Martial)#!"
 dw_direwolf.1101.intrigue:0 "Lay a trap and take them unaware. #weak (Prowess + Intrigue)#!"
 dw_direwolf.1101.learning:0 "Bait them, poison them. #weak (Prowess + Learning)#!"
 dw_direwolf.1103.t:0 "The Wolf-Slayer"
 dw_direwolf.1103.desc:0 "It is done. The great wolf [dw_hunt_pack_leader.GetShortUIName] lies dead in the snow, its pack scattered and slain around it, and [dw_hunter.GetShortUIName] stands over the bodies bloodied but unbowed. The roads of [dw_hunt_county.GetName] are safe again - and there will be songs of this, about [dw_hunt_pack_leader.GetShortUIName]."
 dw_direwolf.1103.a:0 "A hunt worth the telling."
 dw_direwolf.1104.t:0 "The Hunt Goes wrong"
 dw_direwolf.1104.desc:0 "It went wrong. The pack was faster, or fiercer, or simply luckier than the hunter that came for it, and [dw_hunter.GetShortUIName] was borne down snarling into the dark. The wolves still hunt in [dw_hunt_county.GetName]."
 dw_direwolf.1104.a:0 "The wild wins this day."
 dw_command_direwolf_in_war_decision:0 "Command Your Wolf in War"
 dw_command_direwolf_in_war_decision_tooltip:0 "Decide how your direwolf fights - at your side, in the enemy's line, at their commander's throat, along the flanks, or not at all."
 dw_command_direwolf_in_war_decision_desc:0 "A direwolf is worth a dozen swords in the press of battle. Choose where it fights, or keep it home."
 dw_command_direwolf_in_war_decision_confirm:0 "Call the wolf"
 death_direwolf_mauled:0 "was mauled to death by a direwolf"
 death_direwolf_mauled_killer:0 "was mauled to death by [TARGET_CHARACTER.GetUIName]"
 dw_direwolf.1200.t:0 "The Wolf and the Dragon"
 dw_direwolf.1200.desc:0 "[the_wolf.GetShortUINameNoTooltip] slinks into the yard low and quiet, tracking along the stone wall where it thinks it is hidden.\n\n[the_dragon.GetShortUINameNoTooltip] does not even need to descend. A single massive, reptilian eye tracks the beast, followed by a slow exhale of sulfur and ash that chars the cobbles. The direwolf freezes—primal instinct recognizing an apex predator far beyond its own weight. A shadow falls over the yard as the dragon snaps forward, the sound like a falling gate."
 dw_direwolf.1200.a:0 "Throw myself between them!"
 dw_direwolf.1200.b:0 "Command the dragon to stand down!"
 dw_direwolf.1200.c:0 "Turn away. It is nature's course."
 dw_direwolf.1200.t.saved:0 "You throw yourself across the cobbles, screaming a command. [the_dragon.GetShortUINameNoTooltip] pulls back its massive jaw just inches from your face, snorting heat into your eyes. [the_wolf.GetShortUINameNoTooltip] scuttles away into the kennels, terrified but alive."
 dw_direwolf.1200.t.failed:0 "You sprinted forward, but you were far too slow. The dragon's jaws snapped shut with a violent *crunch*, and the blow from its sweeping wing threw you across the yard. The wolf is gone."
 dw_direwolf.1200.t.recalled:0 "Your voice echoes off the stone keep, sharp as a whip. [the_dragon.GetShortUINameNoTooltip] halts mid-strike, snorting smoke, before sulking back to its roost."
 dw_direwolf.1200.t.ignored:0 "You shout, but the beast ignores your voice completely. There is a flash of heat, a sharp *snap* of bones, and a sickening gulp. [the_dragon.GetShortUINameNoTooltip] licks its snout, utterly unbothered."

 dw_direwolf.1210.t:0 "The Dragon and the Wolf"
 dw_direwolf.1210.desc:0 "[the_dragon.GetShortUINameNoTooltip] made the fatal mistake of landing in the yard while [the_wolf.GetShortUINameNoTooltip] was chewing on a leg bone. Nobody ever taught the direwolf what a dragon is, nor does it seem to care.\n\nWith an ungodly snarl, the wolf lunged, sinking its fangs into the dragon's tail. The great beast squealed like a whipped pig, thrashing frantically to escape, but the direwolf dragged the screaming monster down into the mud by its throat like a glorified mutton chop.\n\nThere is blood and scales everywhere. [the_wolf.GetShortUINameNoTooltip] is currently belching up small wads of burnt dragon-skin."
 dw_direwolf.1210.a:0 "Good wolf... I think?"
 dw_direwolf.1210.b:0 "Did the Wolf eat a dragon???"
 dw_find_direwolf_mate_decision:0 "Find a Mate for [ROOT.Char.MakeScope.Var('bonded_direwolf').Char.GetFirstNameNoTooltip]"
 dw_find_direwolf_mate_decision_tooltip:0 "Send someone into the wolfswood - or go yourself - to bring back a mate for your direwolf."
 dw_find_direwolf_mate_decision_desc:0 "One wolf is a companion. Two are the beginning of a pack.\n\n[ROOT.Char.MakeScope.Var('bonded_direwolf').Char.GetFirstNameNoTooltip] has taken no mate, and none will come to a hall full of men on its own. Somewhere in the deep wood there is one that would - if it can be found, and cornered, and brought home alive.\n\n#I The wolves know the old blood. Yours runs at #V [ROOT.Char.MakeScope.ScriptValue('dw_direwolf_wolf_blood_value')|0]%#!"
 dw_find_direwolf_mate_decision_confirm:0 "Send for one"
 dw_find_direwolf_mate_decision_effect_tt:0 "Begin the search for a #V mate#! - it may end in a second wolf, or in a maimed huntsman"
 dw_direwolf_mate_world_cap_tt:0 "There are too many direwolves in the world already"
 dw_direwolf_mate_pack_cap_tt:0 "Your hall cannot hold another direwolf"
 dw_direwolf.1300.t:0 "A Mate for the Wolf"
 dw_direwolf.1300.desc:0 "[dw_lonely_wolf.GetShortUINameNoTooltip] has been restless for weeks - pacing the walls at dusk, answering things heard far off that nobody else can hear.\n\nThere is a mate out there somewhere in the wolfswood. Finding it is one thing. Bringing a full-grown direwolf home alive is quite another, and whoever tries will be doing it within reach of its teeth.\n\n#I Chance of success: #V [ROOT.Char.MakeScope.ScriptValue('dw_direwolf_mate_hunt_chance_value')|0]%#!"
 dw_direwolf.1300.a:0 "I will go myself."
 dw_direwolf.1300.b:0 "Send [dw_mate_hunter.GetShortUINameNoTooltip]."
 dw_direwolf.1300.c:0 "Let the beast pine."
 dw_direwolf.1301.t:0 "Two Wolves"
 dw_direwolf.1301.desc:0 "[dw_mate_hunter.GetShortUINameNoTooltip] came back out of the trees with a second direwolf on a rope, lean and furious and very much alive.\n\nThe rope came off in the yard. For a long moment the two of them stood nose to nose and nobody breathed.\n\nThen [dw_lonely_wolf.GetShortUINameNoTooltip] lay down in the snow, and the other lay down beside it. Whatever was decided there was decided without you."
 dw_direwolf.1301.a:0 "Let them be."
 dw_direwolf.1302.t:0 "The Wood Keeps Its Own"
 dw_direwolf.1302.desc:0 "They found it. That was the easy part.\n\n[dw_mate_hunter.GetShortUINameNoTooltip] came back without a wolf, and not entirely whole - and [dw_lonely_wolf.GetShortUINameNoTooltip] is still alone, still pacing, still listening to something out past the treeline."
 dw_direwolf.1302.a:0 "The wood keeps what it wants."
 dw_soundtrack_list:0 "DireWolves Soundtrack:"
 the_pack:0 "The Pack"
 dw_direwolf.1400.t:0 "Teeth in the Line"
 dw_direwolf.1400.desc.wolf_killed:0 "It was a knight in plate, and it was always going to come to this.\n\n[dw_maul_wolf.GetShortUINameNoTooltip] got its jaws on him once. [dw_maul_knight.GetShortUINameNoTooltip] put the sword through it twice, and the second time the wolf did not get up.\n\nSomewhere on the far side of the field, you feel it go."
 dw_direwolf.1400.c:0 "It should never have been on the field."
 dw_direwolf.1500.t:0 "The Bond Is Broken"
 dw_direwolf.1500.desc:0 "[dw_dead_wolf.GetShortUINameNoTooltip] is dead.\n\nYou knew before they came to tell you. There was a moment - you could not say when, exactly - when something that had been there since the day the bond took simply stopped being there, and left a quiet behind it that you have no word for.\n\n#I The bond is ended. What it gave you is ended with it.#!"
 dw_direwolf.1500.a:0 "There is a hole in the world."
 DW_DIREWOLF_TREE_TT:0 "#I Click to see this direwolf's lineage#!"
 DW_DIREWOLF_TREE_TITLE:0 "The Wolf Line"
 DW_DIREWOLF_TREE_MEMBERS:0 "Wolves: #V [GetPlayer.MakeScope.Var('dw_tree_total').GetValue|0]#!"
 DW_DIREWOLF_TREE_LIVING:0 "Still living: #V [GetPlayer.MakeScope.Var('dw_tree_living').GetValue|0]#!"
 DW_DIREWOLF_TREE_DEAD:0 "dead"
 DW_DIREWOLF_TREE_OUT_OF:0 "out of [Character.GetMother.GetFirstNameNoTooltip]"
 DW_DIREWOLF_TREE_GEN_0:0 "The Old Blood"
 DW_DIREWOLF_TREE_GEN_1:0 "Second Generation"
 DW_DIREWOLF_TREE_GEN_2:0 "Third Generation"
 DW_DIREWOLF_TREE_GEN_3:0 "Fourth Generation"
 DW_DIREWOLF_TREE_GEN_4:0 "Fifth Generation"

 # Battle stances
 dw_direwolf.1600.guard:0 "Stay with me."
 dw_direwolf.1600.guard.tt:0 "#V Guard#!: the wolf keeps the press off you, wounding knights who come too close and lending you #P +4#! [prowess|E] in the moment. It rarely duels, so it is rarely in danger."
 dw_direwolf.1600.hunt_knights:0 "Into their line."
 dw_direwolf.1600.hunt_knights.tt:0 "#V Hunt Knights#!: the wolf goes after the enemy's knights - wounding or killing them, or dying in the attempt. #weak (The old way.)#!"
 dw_direwolf.1600.hunt_commander:0 "Bring me their commander."
 dw_direwolf.1600.hunt_commander.tt:0 "#V Hunt the Commander#!: rarely gets close, and a commander is well guarded. When it does, the commander may be maimed or killed - and the wolf is far likelier to die."
 dw_direwolf.1600.flanks:0 "Run their flanks."
 dw_direwolf.1600.flanks.tt:0 "#V Harry the Flanks#!: no duels, little danger. Enemy armies suffer more casualties, and the wolf howls more often."
 dw_direwolf.1600.kennel:0 "Not this war."
 dw_direwolf.1600.kennel.tt:0 "#V Kennel#!: the wolf stays home. No bonus, no risk."
 dw_stance_guard_tooltip:0 "#V Guard#!: the wolf keeps the press off you, wounding knights who come too close and lending you #P +4#! [prowess|E] in the moment. It rarely duels, so it is rarely in danger."
 dw_stance_hunt_knights_tooltip:0 "#V Hunt Knights#!: the wolf goes after the enemy's knights - wounding or killing them, or dying in the attempt. #weak (The old way.)#!"
 dw_stance_hunt_commander_tooltip:0 "#V Hunt the Commander#!: rarely gets close, and a commander is well guarded. When it does, the commander may be maimed or killed - and the wolf is far likelier to die."
 dw_stance_flanks_tooltip:0 "#V Harry the Flanks#!: no duels, little danger. Enemy armies suffer more casualties, and the wolf howls more often."
 dw_stance_kennel_tooltip:0 "#V Kennel#!: the wolf stays home. No bonus, no risk."

