 dw_direwolf.9000.t:0 "The Blood of the Wolf"
 dw_direwolf.9000.desc:0 ""
 dw_direwolf.9000.prompt:0 ""
 dw_direwolf.9000.picked:0 "\n\n#V [dw_blood_pick.GetFullName]#! carries #V [dw_blood_pick.MakeScope.ScriptValue('dw_direwolf_wolf_blood_value')|0]%#! wolf-blood."
 dw_direwolf.9000.a:0 "Read that one."
 dw_direwolf.9000.b:0 "Enough."

 dw_gift_direwolf_pup_interaction:0 "Gift a Direwolf Pup"
 dw_gift_direwolf_pup_interaction_desc:0 "You gift a direwolf pup to this character."
 dw_direwolf.0120.t:0 "A Pup for the Giving"
 dw_direwolf.0120.desc:0 "The litter tumbles over itself in the straw, and not one of them knows what is about to be decided.\n\nChoose which of them goes with [dw_gift_target.GetShortUIName]."
 dw_direwolf.0120.a:0 "This one. Take it, and mind it well."
 dw_direwolf.0120.b:0 "On reflection, they stay with me."
 dw_direwolf_gift_pup_toast:0 "#V [dw_gift_pup.GetShortUIName]#! has been given to #V [dw_gift_target.GetShortUIName]#!."
 dw_direwolf.0110.t:0 "The Wolf at Your Heel"
 dw_direwolf.0110.desc:0 "There is a wolf at your side. Whether you tamed it in the wild or it was a gift of a lord that found it in the snow. This wolf is bonded to you. What is it?"
 dw_direwolf.0110.a:0 "A pup. Let it grow up beside me."
 dw_direwolf.0110.b:0 "Full-grown. I have no years to waste."

 dw_find_direwolf_pup_decision:0 "Seek a Direwolf Pup"
 dw_find_direwolf_pup_decision_tooltip:0 "Send word to the hunters and the wildlings that you search for a direwolf whelp."
 dw_find_direwolf_pup_decision_desc:0 "Gives you a direwolf pup"
 dw_find_direwolf_pup_decision_confirm:0 "Send word"
 dw_find_direwolf_pup_decision_effect_tt:0 "A direwolf #V pup#! joins your court"

 dw_find_direwolf_adult_decision:0 "Seek a Grown Direwolf"
 dw_find_direwolf_adult_decision_tooltip:0 "Take in a direwolf that is already full-grown."
 dw_find_direwolf_adult_decision_desc:0 "Gives you a grown direwolf"
 dw_find_direwolf_adult_decision_confirm:0 "Take it in"
 dw_find_direwolf_adult_decision_effect_tt:0 "A #V full-grown#! direwolf joins your court"

 DW_DIREWOLF_HOST_LABEL:0 "Kept By"
 DW_DIREWOLF_BONDED_WARG_LABEL:0 "Bonded To"
 DW_DIREWOLF_FEROCITY_LABEL:0 "Ferocity"
 DW_DIREWOLF_FEROCITY_TOOLTIP:0 "#T Ferocity#!\n\nHow dangerous this direwolf is in a fight."
 DW_DIREWOLF_STAGE_LABEL:0 "Years"
 DW_DIREWOLF_STAGE_TOOLTIP:0 "#T Age#!\n\nA direwolf reaches its full size in its third year.\n\n#I Pup#! — under 1\n#I Young Wolf#! — 1 to 2\n#I Full-Grown#! — 3 and over"

 death_direwolf:0 "torn apart by a direwolf"
 death_direwolf_killer:0 "torn apart by [ROOT.Char.Custom('GetHerHis')] own direwolf"

 death_direwolf_stag:0 "Impaled by a stag"

 dw_bonded_direwolf_combat_modifier:0 "Fights alongside a Direwolf"
 dw_bonded_direwolf_combat_modifier_desc:0 "The animal fights where they fight. Most men cower in fear upon seeing this beast."
 dw_direwolf_guard_modifier:0 "Warded by the Wolf"
 dw_direwolf_guard_modifier_desc:0 "A direwolf sleeps in this characters chamber. Schemes against them might turn bloody."
 dw_grieving_bond_modifier:0 "Grieving the Bond"
 dw_grieving_bond_modifier_desc:0 "This character is bond-broken. They eat little and speak less."
 dw_direwolf_hunt_modifier:0 "Blooded Together"
 dw_direwolf_hunt_modifier_desc:0 "This character was on a hunt with his direwolf."

 dw_play_with_direwolf_decision:0 "Play with the Direwolf"
 dw_play_with_direwolf_decision_tooltip:0 "Spend an afternoon with your direwolf."
 dw_play_with_direwolf_decision_desc:0 "A direwolf can easily kill a man. This one wants to play fetch. \n You suppose it might just be an overgrown dog sometimes. Though not always."
 dw_play_with_direwolf_decision_confirm:0 "Just throw the stick"
 dw_play_with_direwolf_decision_effect_tt:0 "Lose #V stress#!, and the bond #V deepens#!"

 dw_hunt_with_direwolf_decision:0 "Hunt with the Direwolf"
 dw_hunt_with_direwolf_decision_tooltip:0 "Take the wolf into the wood and see what it finds."
 dw_hunt_with_direwolf_decision_desc:0 "Taking a direwolf on a hunt, means there is very little for a human to do. Hounds drive their prey forward so that the humans can slay the beast.  A direwolf will most-likely just bring you the dead animal."
 dw_hunt_with_direwolf_decision_confirm:0 "Into the wood"
 dw_hunt_with_direwolf_decision_effect_tt:0 "Gain #V martial lifestyle experience#! and #V prestige#!"

 dw_beyond_the_wall_expedition_decision:0 "Ride Beyond the Wall"
 dw_beyond_the_wall_expedition_decision_tooltip:0 "There are many direwolves beyond the wall. Go there to find and tame a feral one."
 dw_beyond_the_wall_expedition_decision_desc:0 "South of the Wall a direwolf is a story to frighten children. North of it, there are many howling in the night. \n\n Taming one is not as easy a task as you might think."
 dw_beyond_the_wall_expedition_decision_confirm:0 "Ride north"
 dw_beyond_the_wall_expedition_decision_effect_tt:0 "You #V may#! return with a #V direwolf#!"

 dw_direwolf_must_be_grown_tt:0 "Your direwolf must be atleast a year old"
 dw_direwolf_must_be_ferocious_tt:0 "Your direwolf must be grown, and savage enough to do it"

 dw_execute_by_direwolf_interaction:0 "Feed to the Direwolf"
 dw_execute_by_direwolf_interaction_desc:0 "Release the wolf into the cell. Enjoy the show, as it ravages on the victim."

 dw_direwolf.0300.t:0 "The Litter in the Snow"
 dw_direwolf.0300.desc:0 "The mother is dead a day at least, an antler broken off in her throat. She is the size of a horse and yet she lies dead.\n\nThe pups are alive though. Snuggling to their mothers cold body."
 dw_direwolf.0300.a:0 "Take one. Leave the rest to the snow."
 dw_direwolf.0300.b:0 "One for each of my children."
 dw_direwolf.0300.c:0 "They are wolves. Let the wood have them."

 dw_direwolf.0301.t:0 "Beyond the Wall"
 dw_direwolf.0301.desc:0 "Soft paws have been pacing in the snow around your camp each night. Sometimes, when the moon stands high, you can hear it. Howling at the moon. \n\n Finally one morning, it just stands before you. The wolves eyes glaring into yours."
 dw_direwolf.0301.a:0 "Do not look away."

 dw_direwolf.0200.t:0 "The Boar in the Thicket"
 dw_direwolf.0200.desc:0 "You do not hear the boar until its massive body is already in full charge towards you, and by then it is close enough that you can see the mud on its tusks.\n\nSomething grey goes past your shoulder without touching you. The noise afterwards is brief."
 dw_direwolf.0200.a:0 "It was finished before I had drawn."

 dw_direwolf.0400.t:0 "In the Dark"
 dw_direwolf.0400.desc:0 "You wake in the night. At the chamber's door the shadow of a lone man stands. Still and only now realizing that a direwolf isn't just a dog. \n\n with one great leap, the wolf threw the man to the ground, ending his life before your eyes can adjust to the dark."
 dw_direwolf.0400.a:0 "It knew before I did."

 dw_direwolf.0302.t:0 "South of the Wall"
 dw_direwolf.0302.desc:0 "Direwolves do not come south of the Wall. Every maester in the Citadel will tell you so, and they have been right for two hundred years.\n\nThe thing in the brake is half-starved and no bigger than a cat. Whatever brought its mother this far south, she did not survive it. The pup would die here, alone."
 dw_direwolf.0302.a:0 "Then it comes with me."
 dw_direwolf.0302.b:0 "An omen is not a pet."

 dw_direwolf.0500.t:0 "The Wolves of Winterfell"
 dw_direwolf.0500.desc:0 "The stag was dead, and it had not died alone. The direwolf laid in the snow beside it with a foot of shattered antler buried in her throat, the first seen south of the Wall in two hundred years, and dead before anyone could name her a wonder.\n\nFive pups blind and whining against her cold flank. Five, and five trueborn Starks to hold them.\n\nYour bastard is already walking back toward the treeline. He has heard something the rest of you have not.\n\nHe returned with a white bundle in his hands."
 dw_direwolf.0500.a:0 "The old gods do not send signs by halves."

 trait_direwolf_alpha:0 "Alpha"
 trait_direwolf_alpha_desc:0 "This is the Alpha. The Leader of the Pack and its strongest member."
 trait_direwolf_beta:0 "Beta"
 trait_direwolf_beta_desc:0 "This is the Beta. It backs the Alpha in a fight and keeps the rest in order. Maybe it will make a move to rise in rank."
 trait_direwolf_omega:0 "Omega"
 trait_direwolf_omega_desc:0 "This is the Omega. The weakest member of the pack. At the bottom of the pack, the only way is up."
 trait_direwolf_outcast:0 "Outcast"
 trait_direwolf_outcast_desc:0 "It sleeps apart, hunts apart, and answers to no rank."

 relation_direwolf_mate_male:0 "Mate"
 relation_direwolf_mate_female:0 "Mate"
 relation_direwolf_mate_male_possessive:0 "Mate"
 relation_direwolf_mate_female_possessive:0 "Mate"
 dw_direwolf_mate_reason:0 "they are mated"

 dw_denning_modifier:0 "Denning"
 dw_denning_modifier_desc:0 "She has dug in somewhere dark and will not be moved. Whatever the pack does this season, it does without her."
 dw_pack_savage_modifier:0 "Savage Pack"
 dw_pack_savage_modifier_desc:0 "The Alpha is a killer, and a pack is only ever as gentle as the thing leading it."
 dw_pack_protective_modifier:0 "Watchful Pack"
 dw_pack_protective_modifier_desc:0 "The Alpha guards its home. So does the pack."
 dw_pack_docile_modifier:0 "Settled Pack"
 dw_pack_docile_modifier_desc:0 "The Alpha is docile. So is the pack."
 dw_pack_skittish_modifier:0 "Nervous Pack"
 dw_pack_skittish_modifier_desc:0 "The Alpha is skittish, and so is his pack."
 dw_temperament_savage_modifier:0 "Savage Nature"
 dw_temperament_savage_modifier_desc:0 "It is a killer, bloodthirsty and brutal."
 dw_temperament_protective_modifier:0 "Watchful Nature"
 dw_temperament_protective_modifier_desc:0 "It is a protector. It guards what it holds dear"
 dw_temperament_docile_modifier:0 "Settled Nature"
 dw_temperament_docile_modifier_desc:0 "It has nothing to prove to anyone."
 dw_temperament_skittish_modifier:0 "Nervous Nature"
 dw_temperament_skittish_modifier_desc:0 "A nervous direwolf, quick to run away and hide."

 dw_direwolf.0600.t:0 "The Litter"
 dw_direwolf.0600.desc:0 "She has not let anyone near the den in three months, and the kennelmaster has the scars to show for the one time he tried.\n\nThis morning she came out to drink and did not object to being followed. There is a heap of them back there in the dark, blind, furious, the size of cats and already snarling at nothing.\n\nWolves born under your roof. What should you do with them?"
 dw_direwolf.0600.a:0 "Feed them and let them grow."
 dw_direwolf.0600.b:0 "There are children in this hall who should meet them."
 dw_direwolf.0610.t:0 "The Alpha Challenge"
 dw_direwolf.0610.desc:0 "It has been coming for a season. The younger one stopped looking away, then stopped stepping aside, and this morning it ate first.\n\nThe hall has emptied of everything with sense. The rest of the pack has arranged itself in a loose ring. They watch this fight for leadership."
 dw_direwolf.0610.a:0 "This is theirs to settle."
 dw_direwolf.0610.b:0 "Get between them."
 dw_direwolf.0620.t:0 "The Great Howl"
 dw_direwolf.0620.desc:0 "It starts with one, out under the heart tree, and then they are all of them at it. A sound that empties the kitchens and puts the horses through a fence.\n\nNobody gave them news. No rider has come. They simply knew, all at once, that something is gone, and they are howling at the sky in a cry of sorrow.\n\nThe raven will get here in a week and tell you what the wolves told you tonight."
 dw_direwolf.0620.a:0 "They sorrow as will I."
 dw_direwolf.0630.t:0 "Something in the Den"
 dw_direwolf.0630.desc:0 "Whatever came over the wall came for the pups, and it was quiet enough that no man heard it.\n\nShe did. She is between it and the litter now. A mother protects."
 dw_direwolf.0630.a:0 "She does not need us."
 dw_direwolf.0630.b:0 "Send men in with torches."
 dw_direwolf.0640.t:0 "The Pack Trial"
 dw_direwolf.0640.desc:0 "The two of them have been slipping off since the thaw, and they were careful about it, which is the part that will cost them. \n\nThe Alpha has them in the corner of the yard. The rest of the pack has come to watch."
 dw_direwolf.0640.a:0 "Let the pack judge its own."
 dw_direwolf.0640.b:0 "They will not fight in my yard."

 DW_DIREWOLF_MATE_ROW_LABEL:0 "Mate"
 DW_DIREWOLF_PACK_ROW_LABEL:0 "Pack"
 DW_DIREWOLF_TEMPERAMENT_LABEL:0 "Nature"
 DW_DIREWOLF_TEMPERAMENT_TOOLTIP:0 "#T Natures#! explained!\n\nA #V Savage#! wolf is a killer and more dangerous. A #V Watchful#! wolf protects all that is close to it. A #V Docile#! wolf does little. A #V Skittish#! wolf is scared of most things and quick to hide."
 DW_DIREWOLF_TEMPERAMENT_SAVAGE:0 "Savage"
 DW_DIREWOLF_TEMPERAMENT_PROTECTIVE:0 "Watchful"
 DW_DIREWOLF_TEMPERAMENT_DOCILE:0 "Docile"
 DW_DIREWOLF_TEMPERAMENT_SKITTISH:0 "Skittish"
 DW_DIREWOLF_TEMPERAMENT_NONE:0 "None"
 DW_DIREWOLF_RANK_LABEL:0 "Rank"
 DW_DIREWOLF_RANK_TOOLTIP:0 "#T Rank#!\nWhere this one stands in the pack.\n\nThe #V Alpha#! of each sex leads and breeds. #V Betas#! back it. The #V Omega acts like a punching-bag. An #V Outcast#! stands apart and answers to none of them.\n\nThe pack settles this among itself once a year."
 DW_DIREWOLF_RANK_ALPHA:0 "Alpha"
 DW_DIREWOLF_RANK_BETA:0 "Beta"
 DW_DIREWOLF_RANK_OMEGA:0 "Omega"
 DW_DIREWOLF_RANK_OUTCAST:0 "Outcast"
 DW_DIREWOLF_RANK_NONE:0 "None"
 DW_DIREWOLF_FATHER_LABEL:0 "Sire"
 DW_DIREWOLF_MOTHER_LABEL:0 "Dam"
 DW_DIREWOLF_CHILDREN_ROW_LABEL:0 "Pups"
 dw_call_direwolf_decision:0 "Call Your Direwolf"
 dw_call_direwolf_decision_tooltip:0 "Send for your wolf."
 dw_call_direwolf_decision_desc:0 "Your direwolf is not at your side. Although it should be. Send a raven so that it might be send for, to join you at your side."
 dw_call_direwolf_decision_confirm:0 "Call it home"
 dw_call_direwolf_not_here_tt:0 "Your direwolf is not already at your court"
 dw_call_direwolf_decision_effect_tt:0 "Your #V direwolf#! comes to your court. If it is the first, it creates a new pack; if a pack is already here, it joins as an #V Outcast#!"
 dw_direwolf.0700.t:0 "Wolves on the Road"
 dw_direwolf.0700.desc:0 "The horses smelled them before anyone heard them. Now the whole treeline is eyes. And the road ahead is a great deal longer than it was a moment ago.\n\nThese were feral wolves and they have decided your party makes good prey."
 dw_direwolf.0700.a:0 "Close ranks. Show them steel."
 dw_direwolf.0700.b:0 "Off the road. Go around."
 dw_feral_pack_modifier:0 "Feral Direwolf Pack"
 dw_feral_pack_modifier_desc:0 "A wild pack of direwolves ranges through this county. The roads are not safe, and the smallfolk keep their doors barred."
 TRAVEL_POINT_OF_INTEREST_TT_dw_poi_feral_pack:0 "#X Feral Direwolves#! "
 dw_poi_feral_pack_tt:0 "A feral pack of direwolves is roaming this region."
 dw_bond_with_direwolf_bitten_tt:0 "The wolf may refuse the bond and #V bite#! - a savage or skittish one especially"
