 dw_bl_maul_wolf_killed_enemy:0 "Our $knight_culture_player_no_tooltip_lowercase$ [TARGET_CHARACTER.GetShortUINameNoTooltip] killed the direwolf [CHARACTER.GetShortUINameNoTooltip]!"
 dw_bl_hunt_commander_wounded_friendly:0 "Our direwolf [CHARACTER.GetShortUINameNoTooltip] broke through to the enemy commander, [TARGET_CHARACTER.GetShortUINameNoTooltip], and savaged [TARGET_CHARACTER.GetHerHim]!"
 dw_bl_hunt_commander_wounded_enemy:0 "The direwolf [CHARACTER.GetShortUINameNoTooltip] reached our commander, [TARGET_CHARACTER.GetShortUINameNoTooltip], and savaged [TARGET_CHARACTER.GetHerHim]!"
 dw_bl_hunt_commander_killed_friendly:0 "Our direwolf [CHARACTER.GetShortUINameNoTooltip] dragged the enemy commander, [TARGET_CHARACTER.GetShortUINameNoTooltip], from the saddle and killed [TARGET_CHARACTER.GetHerHim]!"
 dw_bl_hunt_commander_killed_enemy:0 "Our commander, [TARGET_CHARACTER.GetShortUINameNoTooltip], was killed by the direwolf [CHARACTER.GetShortUINameNoTooltip]!"
 dw_bl_hunt_commander_wolf_wounded_friendly:0 "Our direwolf [CHARACTER.GetShortUINameNoTooltip] went for the enemy commander, [TARGET_CHARACTER.GetShortUINameNoTooltip], and was beaten back, wounded!"
