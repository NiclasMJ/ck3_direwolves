 dw_bl_maul_killed_friendly:0 "Our direwolf [CHARACTER.GetShortUINameNoTooltip] tore out [TARGET_CHARACTER.GetShortUINameNoTooltip]’s throat!"
 dw_bl_maul_killed_enemy:0 "Our $knight_culture_player_no_tooltip_lowercase$ [TARGET_CHARACTER.GetShortUINameNoTooltip] was killed by the direwolf [CHARACTER.GetShortUINameNoTooltip]!"
