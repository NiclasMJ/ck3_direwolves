l_english:
 trait_direwolf:0 "Direwolf"
 trait_direwolf_desc:0 "A direwolf: far larger than any common wolf, with a heavy build, powerful jaws and a thick coat."
 trait_direwolf_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a direwolf."
 direwolf_companion:0 "Companion"
 direwolf_mate:0 "Mate"

 trait_direwolf_pup:0 "Pup"
 trait_direwolf_pup_desc:0 "Barely weaned, and no larger than a hound's whelp. It will not stay this size for long."
 trait_direwolf_young_wolf:0 "Young Wolf"
 trait_direwolf_young_wolf_desc:0 "Half-grown, but already has sharp teeth."
 trait_direwolf_adult:0 "Full-Grown"
 trait_direwolf_adult_desc:0 "A full-grown direwolf. Tall as a man and more dangerous than five of them."

 trait_direwolf_savage:0 "Savage"
 trait_direwolf_savage_desc:0 "A savage Direwolf. Bloodthirsty and Deadly. Maybe you should keep your distance."
 trait_direwolf_protective:0 "Protective"
 trait_direwolf_protective_desc:0 "A protective Direwolf. The life of their pack comes before their own."
 trait_direwolf_docile:0 "Docile"
 trait_direwolf_docile_desc:0 "An uncommonly gentle Direwolf. It tolerates strangers, children and noise."
 trait_direwolf_skittish:0 "Skittish"
 trait_direwolf_skittish_desc:0 "A skittish Direwolf. Scared easily and also shy."

 trait_direwolf_runt:0 "Runt"
 trait_direwolf_runt_desc:0 "This Direwolf was the smallest of its litter."
 trait_direwolf_massive:0 "Massive"
 trait_direwolf_massive_desc:0 "Enormous even among direwolves. This beast is a sight to behold."
 trait_direwolf_albino:0 "Albino"
 trait_direwolf_albino_desc:0 "A white direwolf, perfectly masked in the snow, if their red eyes wouldn't give them away, that is."
 trait_direwolf_scarred:0 "Scarred"
 trait_direwolf_scarred_desc:0 "Champion of battle and survivor of one many wounds. This direwolf has seen its share."

 trait_direwolf_companion:0 "Wolf-Bonded"
 trait_direwolf_companion_desc_bonded:0 "This character is bonded with #V [ROOT.Var('bonded_direwolf').Char.GetNameNoTooltip]#!."
 trait_direwolf_companion_desc:0 "A direwolf answered to them once."

 trait_direwolf_wild:0 "Wild"
 trait_direwolf_wild_desc:0 "A wild direwolf. Feral, dangerous and prone to attacking the nearest traveler."
 trait_direwolf_bonded:0 "Bonded"
 trait_direwolf_bonded_desc_named:0 "This direwolf is bonded with #V [ROOT.Var('bonded_warg').Char.GetNameNoTooltip]#!."
 trait_direwolf_bonded_desc:0 "It answers to one person, and to nobody else."

 DW_DIREWOLF_COMPANION_ROW_LABEL:0 "Wolf-Bonded"
 trait_track_direwolf_companion:0 "The Bond"
 trait_track_direwolf_companion_desc:0 "How far the two of them have come. The bond between them grows every year."

 dw_direwolf_wolf_blood_label:0 "Wolf-Blood"
 dw_direwolf_wolf_blood_tt:0 "#T Wolf-Blood#!\nHow much of the old blood runs in them: #V [ROOT.Char.MakeScope.ScriptValue('dw_direwolf_wolf_blood_value')|0]%#!.\n\n#V 100%#! - of a wolf-blooded house.\n#V 50%#! - a parent was.\n#V 25%#! - a grandparent was, for each of them.\n\nThe direwolves can tell, and they are kinder to those who have more of it."
 has_direwolf_companion:0 "Wolf-Blooded House"
 has_direwolf_companion_desc:0 "The blood of the First Men runs deep in this house, and the direwolves know it. Its children have a magical connection to these ancient beasts."

 relation_direwolf_companion_male:0 "Wolf-Bonded"
 relation_direwolf_companion_female:0 "Wolf-Bonded"
 relation_direwolf_companion_male_possessive:0 "Wolf-Bonded"
 relation_direwolf_companion_female_possessive:0 "Wolf-Bonded"
 dw_direwolf_bond_reason:0 "they are bonded"

 dw_bond_with_direwolf_interaction:0 "Bond with Direwolf"
 dw_bond_with_direwolf_interaction_desc:0 "Try to bond with the direwolf."
 dw_bond_with_direwolf_same_location_tt:0 "The direwolf must be at the same location as you"

 dw_rename_direwolf_interaction:0 "Name the Direwolf"
 dw_rename_direwolf_interaction_desc:0 "Give a name to the direwolf"
 dw_rename_direwolf_must_own_tt:0 "You must be the direwolf's liege, or the one it is bonded to."

 dw_direwolf.0100.t:0 "A Name for the Wolf"
 dw_direwolf.0100.desc:0 "All beasts deserve a name. As does this."
 dw_direwolf.0100.a:0 "So be it."

 game_rule_category_dw:0 "Direwolves"

